name: Compilation du projet Maintenance-atelier_test_unitaire-github_action

# Le on specifi moment d'execution
on:
    push:
    workflow_dispatch: # Manual trigger on github

jobs:
    compilation: # Nom du job
        runs-on: ubuntu-latest
        # Def etapes workflows
        steps:
            - name: Get_Code
              uses: actions/checkout@v5
            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:                          # ...paramétrée par des entrées (`with:`)
                java-version: '25'
                distribution: 'temurin'
            - name: Add perm
              run: chmod +x mvnw
            - name: Compile projet
              run: ./mvnw compile
            - name: Exec Test multiplier
              run: ./mvnw test -Dtest=CalculatriceTest